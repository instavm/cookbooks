repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: scan-secrets
        name: scan recipe source for credential patterns
        entry: scripts/scan_secrets.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]

      - id: validate-manifests
        name: validate recipe instavm.yaml manifests
        entry: python scripts/validate_manifests.py
        language: system
        pass_filenames: false
        files: ^recipe-.*/(instavm\.yaml|Dockerfile)$
        stages: [pre-commit]

      - id: lib-drift
        name: shared lib/ must match recipe-08 golden template
        entry: bash -c 'python scripts/sync_lib_from_golden.py && git diff --quiet -- "recipe-*/lib/" || { echo "lib/ drifted from recipe-08 golden. Re-run scripts/sync_lib_from_golden.py and commit."; exit 1; }'
        language: system
        pass_filenames: false
        files: ^recipe-08-hn-signal-scanner/lib/.*\.py$|^recipe-.*/lib/(secrets|mail|webhooks|llm)\.py$
        stages: [pre-commit]
