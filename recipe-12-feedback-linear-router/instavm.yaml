schema_version: 2
kind: service
slug: recipe-12-feedback-linear-router
title: Feedback Linear Router
version: 0.1.0
summary: Slack webhook feedback ingestion, LLM classification, Linear issue creation via mock/API.
category: agents
runtime: python-fastapi
deploy:
  kind: upload_and_run
source:
  include:
  - app.py
  - agent.py
  - lib/
  - integrations/
  - requirements.txt
  - instavm.yaml
  - README.md
  exclude:
  - tests/
  - fixtures/
  setup_command: python -m pip install --no-cache-dir -r requirements.txt
vm:
  memory_mb: 1024
  vcpu_count: 1
  timeout_seconds: 86400
app:
  port: 8000
  healthcheck_path: /health
  share_public_default: true
  readiness_timeout_seconds: 120
run:
  workdir: .
  start_command: python -m uvicorn app:app --host 0.0.0.0 --port 8000
vault:
  required: true
  hosts:
  - api.openai.com
  - api.anthropic.com
  - api.linear.app
egress:
  mode: allowlist
  include_vault_hosts: true
  allowed_domains:
  - api.linear.app
  allow_package_managers: true
secrets:
- name: OpenAI
  prompt: OpenAI API key (for chat completions)
  env_name: OPENAI_API_KEY
- name: Anthropic
  prompt: Anthropic API key (for Claude completions)
  env_name: ANTHROPIC_API_KEY
- name: Linear
  prompt: Linear API key
  env_name: LINEAR_API_KEY
- name: Mailtrap
  prompt: Mailtrap SMTP API token
  env_name: MAILTRAP_API_TOKEN
- name: Slack signing
  prompt: Slack signing secret (for webhook verification)
  env_name: SLACK_SIGNING_SECRET
post_deploy_notes:
- "Run `instavm vault setup .` \u2014 bind api.linear.app, api.openai.com."
- GET /health, POST /webhook/slack?dry_run=1
