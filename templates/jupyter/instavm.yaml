schema_version: 2
kind: devbox
slug: jupyter
name: JupyterLab
version: "0.1.0"
description: Run JupyterLab in a browser workspace backed by an InstaVM devbox.
audience: devbox
icon: https://dashboard.instavm.io/template-icons/jupyter.svg
source_repo: jupyterlab/jupyterlab
vm:
  memory_mb: 4096
  vcpus: 2
build:
  - name: Install JupyterLab
    command: python3 -m pip install --break-system-packages jupyterlab
  - name: Create workspace
    command: mkdir -p /root/workspace
runtime: []
terminal:
  tmux_session: jupyter
  # Behind the public share proxy the XSRF cookie/argument round-trip breaks
  # ("'_xsrf' argument missing from POST" on kernel start), so XSRF checking
  # is disabled; auth is already token-less inside the isolated sandbox.
  command: "jupyter lab --ip=0.0.0.0 --port=8888 --allow-root --IdentityProvider.token='' --ServerApp.disable_check_xsrf=True --ServerApp.allow_origin='*' --notebook-dir=/root/workspace"
  cwd: /root/workspace
app:
  port: 8888
  health_path: "/api"
  share: public
egress:
  allow_domains:
    - pypi.org
    - files.pythonhosted.org
