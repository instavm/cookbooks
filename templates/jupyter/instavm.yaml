schema_version: 2
kind: devbox
slug: jupyter
name: JupyterLab
version: "0.1.0"
description: Run JupyterLab in a browser workspace backed by an InstaVM devbox.
audience: devbox
icon: icon.svg
source_repo: jupyterlab/jupyterlab
vm:
  memory_mb: 4096
  vcpus: 2
build:
  - name: Install JupyterLab
    command: pip install jupyterlab
  - name: Create workspace
    command: mkdir -p /root/workspace
runtime: []
terminal:
  tmux_session: jupyter
  command: "jupyter lab --ip=0.0.0.0 --port=8888 --allow-root --NotebookApp.token='' --notebook-dir=/root/workspace"
  cwd: /root/workspace
app:
  port: 8888
  health_path: "/api"
  share: public
egress:
  allow_domains:
    - pypi.org
    - files.pythonhosted.org
