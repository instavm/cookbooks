schema_version: 2
kind: devbox
slug: gemini-cli
name: Gemini CLI
version: "0.1.0"
description: Run Gemini CLI in an empty workspace with an optional Gemini API key.
audience: coding-agent
icon: https://dashboard.instavm.io/template-icons/gemini-cli.svg
source_repo: google-gemini/gemini-cli
vm:
  memory_mb: 2048
  vcpus: 2
build:
  - name: Install Gemini CLI
    command: npm install -g @google/gemini-cli
  - name: Create workspace
    command: mkdir -p /root/workspace
runtime:
  - kind: stage_secret
    name: Stage optional Gemini key
    optional: true
    secrets:
      - name: Gemini API key
        env_name: GEMINI_API_KEY
        optional: true
terminal:
  tmux_session: gemini
  command: gemini
  cwd: /root/workspace
app: null
egress:
  allow_domains:
    - "*"
  allowed_cidrs:
    - 0.0.0.0/0
  allow_http: true
  allow_https: true
  allow_package_managers: true
