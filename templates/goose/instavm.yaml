schema_version: 2
kind: devbox
slug: goose
name: Goose
version: "0.1.0"
description: Run Goose in an empty workspace with optional model provider keys.
audience: coding-agent
icon: https://dashboard.instavm.io/template-icons/goose.svg
source_repo: aaif-goose/goose
vm:
  memory_mb: 2048
  vcpus: 2
build:
  - name: Install Goose
    command: "mkdir -p /root/.local/bin && curl -fsSL https://github.com/aaif-goose/goose/releases/latest/download/download_cli.sh | CONFIGURE=false bash"
  - name: Add local bin to PATH
    command: grep -qxF 'export PATH="/root/.local/bin:$PATH"' /root/.bashrc || echo 'export PATH="/root/.local/bin:$PATH"' >> /root/.bashrc
  - name: Create workspace
    command: mkdir -p /root/workspace
runtime:
  - kind: stage_secret
    name: Stage optional model provider keys
    optional: true
    secrets:
      - name: OpenRouter API key
        env_name: OPENROUTER_API_KEY
        optional: true
      - name: Anthropic API key
        env_name: ANTHROPIC_API_KEY
        optional: true
      - name: OpenAI API key
        env_name: OPENAI_API_KEY
        optional: true
      - name: Google API key
        env_name: GOOGLE_API_KEY
        optional: true
terminal:
  tmux_session: goose
  command: goose
  cwd: /root/workspace
app: null
egress:
  allow_domains:
    - "*"
