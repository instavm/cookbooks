schema_version: 2
kind: devbox
slug: opencode
name: OpenCode
version: "0.1.0"
description: Run OpenCode in an empty workspace with optional model provider keys.
audience: coding-agent
icon: https://dashboard.instavm.io/template-icons/opencode.svg
source_repo: anomalyco/opencode
vm:
  memory_mb: 2048
  vcpus: 2
build:
  - name: Install OpenCode
    command: npm install -g opencode-ai
  - name: Create workspace
    command: mkdir -p /root/workspace
runtime:
  - kind: stage_secret
    name: Stage optional model provider keys
    optional: true
    secrets:
      - name: OpenRouter API key
        env_name: OPENROUTER_API_KEY
        optional: true
      - name: Anthropic API key
        env_name: ANTHROPIC_API_KEY
        optional: true
      - name: OpenAI API key
        env_name: OPENAI_API_KEY
        optional: true
      - name: Google Gemini API key
        env_name: GEMINI_API_KEY
        optional: true
  - kind: update
    name: Update OpenCode
    command: npm update -g opencode-ai
    optional: true
terminal:
  tmux_session: opencode
  command: opencode
  cwd: /root/workspace
app: null
egress:
  allow_domains:
    - "*"
  allowed_cidrs:
    - 0.0.0.0/0
  allow_http: true
  allow_https: true
  allow_package_managers: true
