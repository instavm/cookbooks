# NOTE: license review before badge PR
schema_version: 2
kind: devbox
slug: crush
name: Crush
version: "0.1.0"
description: Run Crush in an empty workspace with optional model provider keys.
audience: coding-agent
icon: https://dashboard.instavm.io/template-icons/crush.png
source_repo: charmbracelet/crush
vm:
  memory_mb: 2048
  vcpus: 2
build:
  - name: Install Crush
    command: npm install -g @charmland/crush
  - name: Create workspace
    command: mkdir -p /root/workspace
runtime:
  - kind: stage_secret
    name: Stage optional model provider keys
    optional: true
    secrets:
      - name: OpenRouter API key
        env_name: OPENROUTER_API_KEY
        optional: true
      - name: Anthropic API key
        env_name: ANTHROPIC_API_KEY
        optional: true
      - name: OpenAI API key
        env_name: OPENAI_API_KEY
        optional: true
terminal:
  tmux_session: crush
  command: crush
  cwd: /root/workspace
app: null
egress:
  allow_domains:
    - openrouter.ai
    - catwalk.charm.sh
    - api.anthropic.com
    - api.openai.com
    - registry.npmjs.org
