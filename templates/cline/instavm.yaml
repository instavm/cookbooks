schema_version: 2
kind: devbox
slug: cline
name: Cline
version: "0.1.0"
description: Run Cline in an empty workspace with optional model provider keys.
audience: coding-agent
icon: https://dashboard.instavm.io/template-icons/cline.png
source_repo: cline/cline
vm:
  memory_mb: 2048
  vcpus: 2
build:
  - name: Install Cline
    command: npm install -g cline
  - name: Create workspace
    command: mkdir -p /root/workspace
runtime:
  - kind: stage_secret
    name: Stage optional model provider keys
    optional: true
    secrets:
      - name: OpenRouter API key
        env_name: OPENROUTER_API_KEY
        optional: true
      - name: Anthropic API key
        env_name: ANTHROPIC_API_KEY
        optional: true
      - name: OpenAI API key
        env_name: OPENAI_API_KEY
        optional: true
terminal:
  tmux_session: cline
  command: cline
  cwd: /root/workspace
app: null
egress:
  allow_domains:
    - openrouter.ai
    - app.cline.bot
    - api.cline.bot
    - api.anthropic.com
    - api.openai.com
    - registry.npmjs.org
