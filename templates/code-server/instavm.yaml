schema_version: 2
kind: devbox
slug: code-server
name: code-server
version: "0.1.0"
description: Run code-server in a browser workspace with optional password auth.
audience: devbox
icon: https://dashboard.instavm.io/template-icons/code-server.svg
source_repo: coder/code-server
vm:
  memory_mb: 4096
  vcpus: 2
build:
  # Pinned release tarball instead of curl|sh: deterministic version, no
  # arbitrary remote script execution. Bump the version in both URL segments.
  - name: Install code-server from pinned release tarball
    command: "curl -fsSL --retry 3 https://github.com/coder/code-server/releases/download/v4.127.0/code-server-4.127.0-linux-amd64.tar.gz -o /root/code-server.tar.gz && mkdir -p /opt/code-server && tar -xzf /root/code-server.tar.gz -C /opt/code-server --strip-components=1 && ln -sf /opt/code-server/bin/code-server /usr/local/bin/code-server && rm -f /root/code-server.tar.gz"
  - name: Create workspace
    command: mkdir -p /root/workspace
runtime:
  - kind: stage_secret
    name: Stage optional password
    optional: true
    secrets:
      - name: code-server password
        env_name: PASSWORD
        optional: true
terminal:
  tmux_session: code-server
  command: 'code-server --bind-addr 0.0.0.0:8080 --auth "$([ -n "${PASSWORD:-}" ] && echo password || echo none)" /root/workspace'
  cwd: /root/workspace
app:
  port: 8080
  health_path: "/healthz"
  share: public
  query: "?folder=/root/workspace"
# Open egress on purpose: a general-purpose IDE needs to reach arbitrary git
# hosts, package registries, and the extension marketplace. All other
# templates pin specific domains; narrow this list if your workspace allows it.
egress:
  allow_domains:
    - "*"
